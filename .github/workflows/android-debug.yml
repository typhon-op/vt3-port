name: VT3 Android Debug

# Builds the debug APK on a self-hosted runner: the machine that already holds your own VT3.exe.
# The executable is read from local disk and is never downloaded, committed, uploaded or printed —
# only its path, size and SHA-256 appear in the log. Nothing game-derived is published except the
# APK, which holds the port's own code plus shader data translated from that file.
#
# Start it from Actions -> "VT3 Android Debug" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      exe_path:
        description: "Your VT3.exe: absolute path, or ~/path. Keep it outside the repository."
        required: false
        default: "~/VT3.exe"
        type: string
      retention_days:
        description: "Days to keep the APK artifact (1-90)"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

concurrency:
  group: android-debug
  cancel-in-progress: false

env:
  IMAGE_SHA256: 52be3cda5edb9aa536394fed656e22270d688d74e86db8602fd39a7512fc80bf
  ANDROID_API: "35"
  BUILD_TOOLS: "36.1.0"
  NDK_VERSION: "30.0.16248370"
  PACKAGE: net.vt3port.game

jobs:
  build:
    name: Build, test and verify the debug APK
    # Self-hosted only: a hosted runner has no access to the executable on your disk. Label the
    # runner "vt3" (Settings -> Actions -> Runners -> New self-hosted runner) or drop that label.
    runs-on: [self-hosted, linux, vt3]
    timeout-minutes: 120
    steps:
      # The artifact is readable by everyone who can read the repository, so a public repository
      # would publish game-derived files. Check before doing any work.
      - name: Refuse to build game-derived artifacts in a public repository
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error title=Repository is public::This APK contains data translated from Virtua Tennis 3 and must not be published. Set the repository to private (Settings -> General -> Danger Zone -> Change repository visibility) and run the workflow again."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Checkout removes untracked files, which is why the executable belongs outside the workspace.
      - name: Locate your VT3.exe on this machine
        env:
          VT3_EXE_INPUT: ${{ github.event.inputs.exe_path }}
        run: |
          set -euo pipefail
          src="${VT3_EXE_INPUT:-~/VT3.exe}"
          case "$src" in
            "~/"*) src="$HOME/${src#\~/}" ;;
          esac
          case "$src" in
            /*) exe="$src" ;;
            *) exe="$GITHUB_WORKSPACE/$src" ;;
          esac
          if [ ! -f "$exe" ]; then
            echo "::error title=VT3.exe not found::Nothing on this runner at '${exe}'. Put your own English v1.0.1 VT3.exe there (a zip that contains it also works), keep it outside the repository checkout, or set the exe_path input. The workflow never downloads an executable."
            exit 1
          fi
          case "$exe" in
            "$GITHUB_WORKSPACE"/*)
              echo "::warning::The executable is inside the repository checkout. actions/checkout cleans untracked files, so a later run may delete it. Keep it at e.g. ~/VT3.exe." ;;
          esac
          size=$(stat -c %s "$exe")
          if [ "$size" -lt 1000000 ]; then
            echo "::error title=That is not VT3.exe::'${exe}' is ${size} bytes; the real executable is 5,538,816 bytes (a zip of it about 1,775,464)."
            exit 1
          fi
          echo "VT3_EXE=$exe" >> "$GITHUB_ENV"
          echo "executable: ${exe} (${size} bytes, sha256 $(sha256sum "$exe" | cut -d' ' -f1))"

      # Uses the toolchain the README already asks for rather than installing packages on your
      # machine. Anything missing is named, with the command that fixes it.
      - name: Check the local toolchain
        run: |
          set -uo pipefail
          fail=0
          need() { command -v "$1" > /dev/null 2>&1 || { echo "::error title=Missing $1::$2"; fail=1; }; }
          need cmake "Install CMake 3.22 or newer"
          need ninja "Install Ninja"
          need glslangValidator "Install the Vulkan SDK, or the glslang package"
          need javac "Install JDK 17 or newer and set JAVA_HOME"
          need python3 "Install Python 3.10 or newer"
          need cc "Install a host C compiler"
          python3 -c "import pefile, capstone" 2> /dev/null || {
            echo "::error title=Missing Python packages::python3 -m pip install pefile capstone"; fail=1; }
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error title=ANDROID_HOME is not set::Point it at your Android SDK, e.g. \$HOME/Android/Sdk"; fail=1
          else
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            [ -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" ] || {
              echo "::error title=Missing build-tools::$ANDROID_HOME/build-tools/$BUILD_TOOLS not found. sdkmanager \"build-tools;$BUILD_TOOLS\""; fail=1; }
            [ -f "$ANDROID_HOME/platforms/android-$ANDROID_API/android.jar" ] || {
              echo "::error title=Missing platform::sdkmanager \"platforms;android-$ANDROID_API\""; fail=1; }
          fi
          : "${ANDROID_NDK_HOME:=${ANDROID_NDK_ROOT:-$ANDROID_HOME/ndk/$NDK_VERSION}}"
          if [ ! -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" ]; then
            echo "::error title=Missing NDK::Expected $ANDROID_NDK_HOME. sdkmanager \"ndk;$NDK_VERSION\" and set ANDROID_NDK_HOME"; fail=1
          else
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi
          [ "$fail" -eq 0 ] || exit 1
          cmake --version | head -1
          ninja --version
          glslangValidator --version | head -1
          javac -version

      - name: Native diagnostics test
        run: |
          set -euo pipefail
          gcc -O2 -std=gnu11 -Wall -Wextra -Iruntime/include \
              runtime/tests/diag_log_test.c runtime/src/core/log.c runtime/src/core/diag.c \
              -lpthread -o "$RUNNER_TEMP/vt3diagtest"
          "$RUNNER_TEMP/vt3diagtest" | tee "$RUNNER_TEMP/native-test.txt"

      - name: Java diagnostics test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagjava"
          javac -Xlint:all -d "$RUNNER_TEMP/diagjava" \
              android/game/java/net/vt3port/game/DiagCore.java \
              android/game/java/net/vt3port/game/DiagData.java \
              android/game/java/net/vt3port/game/DiagReport.java \
              tools/diagtest/DiagHostTest.java
          java -cp "$RUNNER_TEMP/diagjava" DiagHostTest | tee "$RUNNER_TEMP/java-test.txt"

      # build.py translates the executable into build/game/vt3.c and image.bin, generates the shader
      # pack, compiles the ARM64 library, and calls android/build_apk.py, which reuses
      # build/android/debug.keystore when it exists, so an existing signing identity is kept.
      - name: Build the ARM64 debug APK
        run: |
          set -euo pipefail
          python3 -u build.py android --exe "$VT3_EXE"

      - name: Verify the generated image against the expected hash
        run: |
          set -euo pipefail
          actual=$(sha256sum build/game/image.bin | cut -d' ' -f1)
          echo "image.bin sha256: $actual"
          if [ "$actual" != "$IMAGE_SHA256" ]; then
            echo "::error title=Wrong VT3.exe::The translated image is $actual, expected $IMAGE_SHA256. That file is not the English v1.0.1 build the port supports."
            exit 1
          fi
          echo "the supplied executable is the supported English v1.0.1 build"

      - name: Verify alignment, signature, package, architecture and diagnostics
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=build/android/VT3-Android.apk
          test -s "$APK"

          "$BT/zipalign" -c -p 4 "$APK"
          echo "zipalign: verified"

          "$BT/apksigner" verify --print-certs "$APK"
          echo "apksigner: verified"

          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='${PACKAGE}'" "$RUNNER_TEMP/badging.txt"
          grep -q "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
          echo "badging: ${PACKAGE}, arm64-v8a"

          unzip -p "$APK" lib/arm64-v8a/libvt3android.so > "$RUNNER_TEMP/libvt3android.so"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$RUNNER_TEMP/libvt3android.so" | grep -q "Machine:.*AArch64"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for sym in ANativeActivity_onCreate JNI_OnLoad vt3_diag_jni_write vt3_logc; do
            "$NM" -D --defined-only "$RUNNER_TEMP/libvt3android.so" | grep -q " $sym$" \
              || { echo "::error::the shipped library is missing $sym"; exit 1; }
          done
          echo "native library: ELF64 AArch64 with the game entry point and the diagnostics bridge"

          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/classes.dex"
          for cls in DiagCore DiagLog DiagReport DiagInfo DiagCrashHandler DiagFileProvider Diagnostics Vt3App; do
            strings "$RUNNER_TEMP/classes.dex" | grep -q "Lnet/vt3port/game/${cls};" \
              || { echo "::error::the shipped dex is missing ${cls}"; exit 1; }
          done
          strings "$RUNNER_TEMP/classes.dex" | grep -qx "VT3_Diagnostic_Report.txt"
          echo "dex: diagnostics classes and the TXT report name are present"

      - name: Write SHA256SUMS.txt and BUILD_INFO.txt
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          APK=build/android/VT3-Android.apk
          mkdir -p artifact
          cp "$APK" artifact/VT3-Android.apk
          ( cd artifact && sha256sum VT3-Android.apk > SHA256SUMS.txt )

          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
          VERSION_CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt" | head -1)
          SIZE=$(stat -c %s "$APK")
          SHA=$(cut -d' ' -f1 artifact/SHA256SUMS.txt)
          SIGNER=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXE_SHA=$(sha256sum "$VT3_EXE" | cut -d' ' -f1)

          {
            echo "VT3 Android debug build"
            echo "========================"
            echo "Commit:            ${GITHUB_SHA}"
            echo "Ref:               ${GITHUB_REF_NAME}"
            echo "Run:               ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Built (UTC):       $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Built on:          self-hosted runner, $(uname -sm)"
            echo
            echo "APK version:       ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "Package:           ${PACKAGE}"
            echo "Architecture:      arm64-v8a"
            echo "APK file:          VT3-Android.apk"
            echo "APK size (bytes):  ${SIZE}"
            echo "APK SHA-256:       ${SHA}"
            echo "Signer SHA-256:    ${SIGNER}"
            echo
            echo "Game executable"
            echo "---------------"
            echo "Supplied locally:  ${VT3_EXE}"
            echo "Executable SHA256: ${EXE_SHA}"
            echo "Image SHA-256:     ${IMAGE_SHA256} (verified against build/game/image.bin)"
            echo "The executable is not included in this artifact and was not uploaded anywhere."
            echo
            echo "Game data"
            echo "---------"
            echo "This APK carries no game data. The on-device installer is unchanged: it takes the"
            echo "player's own disc image or extracted folder, verifies it and unpacks it on the phone."
            echo
            echo "Tests"
            echo "-----"
            echo "Native diag_log_test: PASS"
            echo "Java DiagHostTest:    PASS"
            echo "zipalign -c -p 4:     PASS"
            echo "apksigner verify:     PASS"
            echo "package name:         PASS"
            echo "arm64-v8a library:    PASS (ANativeActivity_onCreate, JNI_OnLoad, vt3_diag_jni_write, vt3_logc)"
            echo "diagnostics in dex:   PASS (8 classes, VT3_Diagnostic_Report.txt)"
            echo
            echo "Native test output"
            echo "------------------"
            cat "$RUNNER_TEMP/native-test.txt"
            echo
            echo "Java test output"
            echo "----------------"
            cat "$RUNNER_TEMP/java-test.txt"
            echo
            echo "Not covered by this workflow: running the game on a device (launch, Vulkan, audio,"
            echo "touch controls, the diagnostics screen, saving and sharing the report)."
          } > artifact/BUILD_INFO.txt

          cat artifact/BUILD_INFO.txt >> "$GITHUB_STEP_SUMMARY"
          echo "APK size ${SIZE} bytes, sha256 ${SHA}"

      # Only the three files below are uploaded. This makes that a checked fact rather than a claim.
      - name: Make sure no game file reaches the artifact
        run: |
          set -euo pipefail
          found=$(find artifact -type f ! -name 'VT3-Android.apk' ! -name 'SHA256SUMS.txt' ! -name 'BUILD_INFO.txt')
          if [ -n "$found" ]; then
            echo "::error title=Unexpected artifact file::The artifact would carry $(echo "$found" | tr '\n' ' '). Only the APK and its two text files may be published."
            exit 1
          fi
          if find artifact \( -iname '*.exe' -o -iname '*.iso' -o -iname '*.bin' -o -iname '*.zip' \) | grep -q .; then
            echo "::error title=Game file in artifact::Refusing to upload an executable, image or archive."
            exit 1
          fi
          ls -l artifact

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VT3-Android-Debug
          path: |
            artifact/VT3-Android.apk
            artifact/SHA256SUMS.txt
            artifact/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: ${{ fromJSON(github.event.inputs.retention_days || '7') }}

      # Leftovers only. The supplied executable is never touched: it is your file, outside the
      # repository, and the next build needs it.
      - name: Remove the build output
        if: always()
        run: |
          rm -rf build artifact
          echo "removed the translated build output; the supplied executable was left untouched"
